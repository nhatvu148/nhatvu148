<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-label="Vu Nguyen — developer tools in Rust, and a script almost nobody can read anymore">
  <rect width="1200" height="180" fill="#FFFFFF"/>

  <!-- 字喃 "chữ Nôm", U+5B57 U+5583. Set large and quiet: the script is the
       subject, not the decoration, so it sits behind the type rather than
       announcing itself. -->
  <text x="1150" y="132" text-anchor="end"
        font-family="'Noto Serif CJK SC','Songti SC','Source Han Serif',serif"
        font-size="128" fill="#2F6F6F" fill-opacity="0.22">字喃</text>

  <text x="60" y="76"
        font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="34" font-weight="600" fill="#1F2328" letter-spacing="-0.4">Developer tools in Rust</text>

  <text x="60" y="112"
        font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="19" fill="#59636E">Agentic coding assistants · MCP servers · AI code review</text>

  <text x="60" y="142"
        font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="19" fill="#59636E">— and a dictionary for a script almost nobody can read anymore</text>

  <!-- Hairline, full bleed: closes the strip without boxing it in. -->
  <rect x="0" y="177" width="1200" height="3" fill="#2F6F6F"/>
</svg>
