# Regenerates images/stat.svg from WakaTime and commits it — the CI equivalent of `task all`.
name: Update stats

on:
  # Allows running manually from the Actions tab
  workflow_dispatch:
  schedule:
    # Every 6 hours. WakaTime's rolling stats lag behind real time and only
    # refresh hours after the user's day ends (UTC+7), so a single 00:00 UTC
    # run kept fetching stale data and committing nothing. Polling 4x/day
    # catches the refresh same-day; the "commit if changed" step below makes
    # the redundant runs free.
    - cron: '0 */6 * * *'

# Needed so the workflow can push the regenerated SVG back to the repo
permissions:
  contents: write

# Avoid overlapping runs racing to push
concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Run main.py (uv)
        run: uv run main.py
        env:
          INPUT_WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

      # Release counts move whenever a tag is pushed in any of the five repos,
      # so the strip is regenerated on the same schedule as the WakaTime graph
      # rather than being a snapshot that quietly goes stale.
      - name: Regenerate the shipping strip
        run: python3 scripts/gen_shipping.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/stat.svg images/shipping-dark.svg images/shipping-light.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            # GitHub's Camo image proxy caches the graph by URL with no purge API,
            # so an unchanged URL keeps showing a days-old graph on the profile.
            # Bump a cache-busting ?v= param whenever the graph changes.
            #
            # The graph is served from raw.githubusercontent, NOT jsDelivr: jsDelivr
            # caches its @master -> commit resolution for 12h and ignores the ?v=
            # param, so it kept serving a pre-push snapshot hours after this ran.
            ts=$(date -u +%Y%m%d%H%M%S)
            sed -i -E "s|images/stat\.svg(\?v=[0-9]+)?|images/stat.svg?v=$ts|" README.md
            sed -i -E "s|images/shipping-(dark|light)\.svg(\?v=[0-9]+)?|images/shipping-\1.svg?v=$ts|g" README.md
            git add README.md
            git commit -m "chore(stats): refresh graphs"
            git push origin HEAD:master
          fi
