# Verifies the stats generator still builds and that the dependency manifests
# agree with each other. Runs on every push and PR to master.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: requirements.txt agrees with uv.lock
        # Two install paths read two different manifests: `uv run main.py`
        # (update-stats.yml) resolves from uv.lock, while pip installs from
        # requirements.txt. Dependabot has bumped one without the other, which
        # silently left the stats workflow on a stale version. Catch that here.
        run: uv run python scripts/check_manifests.py

      - name: main.py compiles
        run: uv run python -m compileall -q main.py
